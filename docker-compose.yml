version: "3.9"
services:
  db:
    image: postgres:16
    container_name: ccbot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - ccbot_pgdata:/var/lib/postgresql/data

volumes:
  ccbot_pgdata: